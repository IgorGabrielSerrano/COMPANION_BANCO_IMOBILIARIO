<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Companion Banco Imobiliário</title>
    <!-- PeerJS CDN for WebRTC Realtime Multi-Device Sync -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-gold: #f1c40f;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
            --accent-purple: #9b59b6;
            --text-color: #f0f6fc;
            --subtext: #8b949e;
            --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; padding: 12px; overflow: hidden; }
        .container { max-width: 480px; margin: 0 auto; width: 100%; height: 100%; display: flex; flex-direction: column; gap: 10px; }
        header { text-align: center; padding-bottom: 6px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.15rem; color: var(--accent-gold); }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; }
        .balance-card { text-align: center; background: linear-gradient(135deg, #161b22 0%, #1c232d 100%); border: 1px solid #38444d; }
        .balance-title { font-size: 0.75rem; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 2rem; font-weight: bold; color: var(--accent-green); margin: 2px 0; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        button:active { transform: scale(0.98); opacity: 0.9; }
        .btn-gold { background: linear-gradient(135deg, #f39c12, #d35400); color: #fff; border: none; }
        .btn-green { background: linear-gradient(135deg, #2ecc71, #27ae60); color: #fff; border: none; }
        .btn-blue { background: linear-gradient(135deg, #3498db, #2980b9); color: #fff; border: none; }
        .btn-red { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; border: none; }
        .btn-small { padding: 4px 8px; font-size: 0.75rem; border-radius: 6px; }
        .btn-large { grid-column: span 2; padding: 14px; font-size: 1.05rem; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
        label { font-size: 0.8rem; color: var(--subtext); }
        input, select { background: #0d1117; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 8px; font-size: 0.95rem; }
        .tx-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .tx-item { font-size: 0.8rem; padding: 6px 10px; background: #0d1117; border-radius: 6px; border-left: 3px solid var(--accent-gold); }
        .player-row { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; background: #0d1117; border-radius: 6px; border: 1px solid var(--border-color); font-size: 0.85rem; }
        .property-chip { display: inline-block; background: #21262d; border: 1px solid #30363d; color: var(--accent-gold); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-right: 4px; margin-top: 2px; }
        .hidden { display: none !important; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 420px; padding: 18px; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto; }
        .quick-amounts { display: flex; gap: 6px; }
        .quick-amounts button { flex: 1; padding: 8px; font-size: 0.8rem; }
        .status-badge { display: inline-block; width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; }
        .status-badge.offline { background: var(--accent-red); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏦 BANCO IMOBILIÁRIO</h1>
            <div style="display:flex; align-items:center; gap:6px;">
                <span id="conn-status-badge" class="status-badge"></span>
                <span id="conn-status-text" style="font-size: 0.75rem; color: var(--subtext);">Offline</span>
            </div>
        </header>

        <!-- LOBBY SCREEN -->
        <div id="screen-lobby" class="card">
            <div style="display: flex; gap: 8px; margin-bottom: 14px;">
                <button id="btn-tab-join" class="btn-green" style="flex:1" onclick="switchTab('join')">🎮 Entrar na Mesa</button>
                <button id="btn-tab-create" style="flex:1" onclick="switchTab('create')">👑 Criar Mesa</button>
            </div>

            <div id="form-join" class="input-group">
                <label>PIN da Mesa (4 dígitos):</label>
                <input type="number" id="join-pin" placeholder="Ex: 7492">
                <label>Seu Nome:</label>
                <input type="text" id="join-name" placeholder="Ex: Igor">
                <button class="btn-green" style="margin-top: 10px;" onclick="joinRoom()">🚀 Entrar na Mesa</button>
            </div>

            <div id="form-create" class="input-group hidden">
                <label>Nome do Banqueiro:</label>
                <input type="text" id="create-banker" placeholder="Ex: Banqueiro Igor">
                <label>Saldo Inicial (R$):</label>
                <input type="number" id="create-cash" value="25000">
                <button class="btn-gold" style="margin-top: 10px;" onclick="createRoom()">👑 Iniciar Nova Mesa</button>
            </div>
        </div>

        <!-- PLAYER DASHBOARD -->
        <div id="screen-player" class="hidden" style="display: flex; flex-direction: column; gap: 10px; height: 100%; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 0;">
                <div>
                    <span id="player-display-name" style="font-weight: bold; font-size: 1rem;">-</span>
                    <span id="player-role-badge" style="font-size: 0.75rem; color: var(--accent-gold); margin-left: 4px;"></span>
                </div>
                <span id="room-pin-display" style="color: var(--accent-gold); font-weight: bold; font-size: 0.9rem;">Mesa #----</span>
            </div>

            <!-- SALDO -->
            <div class="card balance-card">
                <div class="balance-title">Seu Saldo Atual</div>
                <div class="balance-value" id="balance-amount">R$ 25.000</div>
            </div>

            <!-- BOTÃO PONTO DE PARTIDA -->
            <button class="btn-green btn-large" onclick="passGO()">⚡ Ponto de Partida (+R$ 2.000)</button>

            <!-- AÇÕES DE PAGAMENTO -->
            <div class="grid-2">
                <button onclick="openModal('PAY_PLAYER')">💸 Pagar Jogador</button>
                <button onclick="openModal('PAY_BANK')">🏦 Pagar ao Banco</button>
                <button onclick="openModal('RECEIVE_BANK')" style="grid-column: span 2;">💰 Receber do Banco</button>
            </div>

            <!-- SISTEMA DE POSSES (MINHAS PROPRIEDADES) -->
            <div class="card" style="padding: 10px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <span style="font-size: 0.8rem; color: var(--subtext); font-weight: 600;">🏠 Minhas Posses (Propriedades):</span>
                    <button class="btn-blue btn-small" onclick="openPropertyModal()">➕ Comprar Posse</button>
                </div>
                <div id="my-properties-list" style="display: flex; flex-wrap: wrap; gap: 4px;"></div>
            </div>

            <!-- JOGADORES NA MESA -->
            <div class="card" style="padding: 10px;">
                <div style="font-size: 0.8rem; color: var(--subtext); margin-bottom: 6px; display:flex; justify-content:space-between;">
                    <span>👥 Jogadores Conectados na Mesa:</span>
                    <span id="player-count-label" style="color:var(--accent-gold); font-weight:bold;">0</span>
                </div>
                <div id="players-list-container" style="display: flex; flex-direction: column; gap: 6px;"></div>
            </div>

            <!-- HISTÓRICO DA MESA -->
            <div class="card tx-history" id="tx-feed-player">
                <div style="font-size: 0.8rem; color: var(--subtext); margin-bottom: 4px;">📜 Histórico da Mesa em Tempo Real:</div>
            </div>

            <!-- GESTÃO DA MESA -->
            <div style="display: flex; gap: 8px; margin-top: auto; padding-top: 4px;">
                <button id="btn-end-game" class="btn-red" style="flex:1;" onclick="endGame()">🔴 Finalizar Partida</button>
                <button style="flex:1; background: #30363d;" onclick="leaveRoom()">🚪 Sair da Mesa</button>
            </div>
        </div>

        <!-- MODAL DE TRANSFERÊNCIA -->
        <div id="modal-tx" class="modal hidden">
            <div class="modal-content">
                <h3 id="modal-title">💸 Realizar Transferência</h3>
                
                <label id="lbl-recipient" class="hidden">Selecione o Jogador Receptor:</label>
                <select id="modal-recipient" class="hidden" onchange="onRecipientChanged()"></select>

                <label id="lbl-property" class="hidden">Escolher Posse/Propriedade (Aluguel Automático):</label>
                <select id="modal-property" class="hidden" onchange="onPropertySelected()"></select>

                <label>Valor da Transferência (R$):</label>
                <input type="number" id="modal-amount" placeholder="Digite o valor (R$)">
                
                <div class="quick-amounts">
                    <button onclick="addAmount(50)">+50</button>
                    <button onclick="addAmount(100)">+100</button>
                    <button onclick="addAmount(200)">+200</button>
                    <button onclick="addAmount(500)">+500</button>
                    <button onclick="addAmount(2000)">+2k</button>
                </div>

                <label>Motivo ou Descrição:</label>
                <input type="text" id="modal-note" placeholder="Motivo (opcional, ex: Aluguel da Av. Paulista)">
                
                <div style="display: flex; gap: 8px; margin-top: 6px;">
                    <button style="flex:1" onclick="closeModal()">Cancelar</button>
                    <button class="btn-green" style="flex:1" onclick="confirmTransfer()">Confirmar</button>
                </div>
            </div>
        </div>

        <!-- MODAL DE COMPRAR / EDITAR POSSE -->
        <div id="modal-property-editor" class="modal hidden">
            <div class="modal-content">
                <h3 id="prop-modal-title">🏠 Comprar Nova Posse</h3>
                <input type="hidden" id="prop-edit-index" value="-1">

                <label>Nome do Imóvel / Posse:</label>
                <input type="text" id="prop-name-input" placeholder="Ex: Av. Paulista, Maracanã, Cia Eletricidade">

                <label id="lbl-buy-price">Preço de Compra (Pago ao Banco 🏦):</label>
                <input type="number" id="prop-price-input" placeholder="Ex: 3500">

                <label>Valor do Aluguel cobrado de outros jogadores (R$):</label>
                <input type="number" id="prop-rent-input" placeholder="Ex: 350">

                <div style="display: flex; gap: 8px; margin-top: 6px;">
                    <button style="flex:1" onclick="closePropertyModal()">Cancelar</button>
                    <button id="btn-save-prop" class="btn-blue" style="flex:1" onclick="saveProperty()">Confirmar Compra ao Banco</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let state = {
            pin: '',
            playerId: '',
            playerName: '',
            isBanker: false,
            players: {},
            transactions: []
        };

        let peer = null;
        let connections = [];
        let hostConn = null;
        const channel = new BroadcastChannel('banco_imobiliario_channel');

        // Restore Session on Page Refresh
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('companion_session');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = parsed;
                    if (state.pin && state.playerId) {
                        enterGame(true);
                        return;
                    }
                } catch(e){}
            }
        });

        function saveSession() {
            localStorage.setItem('companion_session', JSON.stringify(state));
        }

        function clearSession() {
            localStorage.removeItem('companion_session');
        }

        function setStatus(text, online = true) {
            document.getElementById('conn-status-text').innerText = text;
            const badge = document.getElementById('conn-status-badge');
            badge.className = 'status-badge' + (online ? '' : ' offline');
        }

        function playSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1318, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e){}
        }

        function formatMoney(val) {
            return 'R$ ' + (val || 0).toLocaleString('pt-BR');
        }

        function switchTab(tab) {
            document.getElementById('form-join').classList.toggle('hidden', tab !== 'join');
            document.getElementById('form-create').classList.toggle('hidden', tab !== 'create');
            document.getElementById('btn-tab-join').className = tab === 'join' ? 'btn-green' : '';
            document.getElementById('btn-tab-create').className = tab === 'create' ? 'btn-gold' : '';
        }

        // Create Room
        function createRoom() {
            const banker = document.getElementById('create-banker').value.trim() || 'Banqueiro';
            const cash = parseInt(document.getElementById('create-cash').value) || 25000;

            state.pin = Math.floor(1000 + Math.random() * 9000).toString();
            state.playerId = 'p_banker_' + Date.now();
            state.playerName = banker;
            state.isBanker = true;
            state.players = {};
            state.transactions = [];

            state.players[state.playerId] = {
                name: banker + ' (Banqueiro)',
                balance: cash,
                isBanker: true,
                properties: []
            };

            initHostPeer();
            enterGame();
        }

        // Join Room
        function joinRoom() {
            const pin = document.getElementById('join-pin').value.trim();
            const name = document.getElementById('join-name').value.trim();
            if (!pin || !name) return alert('Preencha o PIN da mesa e seu nome!');

            state.pin = pin;
            state.playerId = 'p_' + Date.now();
            state.playerName = name;
            state.isBanker = false;

            if (!state.players[state.playerId]) {
                state.players[state.playerId] = {
                    name: name,
                    balance: 25000,
                    isBanker: false,
                    properties: []
                };
            }

            initClientPeer();
            enterGame();
        }

        function enterGame(isRestored = false) {
            document.getElementById('screen-lobby').classList.add('hidden');
            document.getElementById('screen-player').classList.remove('hidden');
            document.getElementById('player-display-name').innerText = state.playerName;
            document.getElementById('player-role-badge').innerText = state.isBanker ? '👑 (Banqueiro)' : '';
            document.getElementById('room-pin-display').innerText = 'Mesa #' + state.pin;
            document.getElementById('btn-end-game').style.display = state.isBanker ? 'block' : 'none';

            saveSession();
            updateUI();

            if (isRestored) {
                if (state.isBanker) initHostPeer();
                else initClientPeer();
            }

            channel.onmessage = (e) => {
                if (e.data && e.data.pin === state.pin) {
                    state.players = e.data.players;
                    state.transactions = e.data.transactions;
                    saveSession();
                    updateUI();
                }
            };
        }

        function initHostPeer() {
            const hostId = 'banco-imobiliario-room-' + state.pin;
            peer = new Peer(hostId);

            peer.on('open', () => setStatus('Online (Mesa ' + state.pin + ')'));

            peer.on('connection', (conn) => {
                connections.push(conn);
                conn.on('data', (data) => {
                    handleIncomingData(data);
                    broadcastState();
                });
                conn.on('open', () => broadcastState());
            });

            peer.on('error', () => setStatus('Sincronizado Local', true));
        }

        function initClientPeer() {
            peer = new Peer();
            peer.on('open', () => {
                const hostId = 'banco-imobiliario-room-' + state.pin;
                hostConn = peer.connect(hostId);
                
                hostConn.on('open', () => {
                    setStatus('Conectado à Mesa #' + state.pin);
                    sendToHost({ type: 'JOIN', player: { id: state.playerId, data: state.players[state.playerId] } });
                });

                hostConn.on('data', (data) => handleIncomingData(data));
                hostConn.on('error', () => setStatus('Conexão Local', true));
            });
        }

        function sendToHost(msg) {
            if (hostConn && hostConn.open) {
                hostConn.send(msg);
            }
            channel.postMessage({ pin: state.pin, players: state.players, transactions: state.transactions });
        }

        function broadcastState() {
            saveSession();
            channel.postMessage({ pin: state.pin, players: state.players, transactions: state.transactions });
            connections.forEach(c => {
                if (c.open) {
                    c.send({ type: 'SYNC', players: state.players, transactions: state.transactions });
                }
            });
        }

        function handleIncomingData(data) {
            if (data.type === 'SYNC') {
                state.players = data.players;
                state.transactions = data.transactions;
                saveSession();
                updateUI();
            } else if (data.type === 'JOIN') {
                state.players[data.player.id] = data.player.data;
                broadcastState();
                updateUI();
            } else if (data.type === 'TRANSFER') {
                const tx = data.tx;
                if (state.players[tx.fromId]) state.players[tx.fromId].balance -= tx.amount;
                if (state.players[tx.toId]) state.players[tx.toId].balance += tx.amount;
                state.transactions.push(tx);
                broadcastState();
                updateUI();
            } else if (data.type === 'UPDATE_PROPERTIES') {
                if (state.players[data.playerId]) {
                    state.players[data.playerId].properties = data.properties;
                    broadcastState();
                    updateUI();
                }
            }
        }

        function updateUI() {
            const myData = state.players[state.playerId] || { balance: 25000, properties: [] };
            document.getElementById('balance-amount').innerText = formatMoney(myData.balance);
            
            // Render My Properties Chips
            const myPropsList = document.getElementById('my-properties-list');
            myPropsList.innerHTML = '';
            const props = myData.properties || [];
            
            if (props.length === 0) {
                myPropsList.innerHTML = '<span style="font-size:0.75rem; color:var(--subtext);">(Nenhuma posse cadastrada)</span>';
            } else {
                props.forEach((p, idx) => {
                    const chip = document.createElement('div');
                    chip.className = 'property-chip';
                    chip.innerHTML = `🏠 ${p.name} (Alg: ${formatMoney(p.rent)}) <span onclick="editProperty(${idx})" style="cursor:pointer; margin-left:4px;">✏️</span> <span onclick="deleteProperty(${idx})" style="cursor:pointer; color:var(--accent-red); margin-left:2px;">❌</span>`;
                    myPropsList.appendChild(chip);
                });
            }

            // Update players count & list
            const pKeys = Object.keys(state.players);
            document.getElementById('player-count-label').innerText = pKeys.length;
            
            const plist = document.getElementById('players-list-container');
            plist.innerHTML = '';
            
            pKeys.forEach(pId => {
                const p = state.players[pId];
                const row = document.createElement('div');
                row.className = 'player-row';
                
                let propsHtml = '';
                if (p.properties && p.properties.length > 0) {
                    propsHtml = '<div style="margin-top:2px;">' + p.properties.map(pr => `<span class="property-chip">🏠 ${pr.name} (Alg: ${formatMoney(pr.rent)})</span>`).join('') + '</div>';
                }

                row.innerHTML = `
                    <div style="display:flex; justify-content:space-between; width:100%;">
                        <span><b>${p.name}</b> ${pId === state.playerId ? ' (Você)' : ''}</span>
                        <span style="color:var(--accent-green);font-weight:bold;">${formatMoney(p.balance)}</span>
                    </div>
                    ${propsHtml}
                `;
                plist.appendChild(row);
            });

            // Update transactions feed
            const feed = document.getElementById('tx-feed-player');
            feed.innerHTML = '<div style="font-size: 0.8rem; color: var(--subtext); margin-bottom: 4px;">📜 Histórico da Mesa em Tempo Real:</div>';
            (state.transactions || []).slice().reverse().forEach(tx => {
                const item = document.createElement('div');
                item.className = 'tx-item';
                item.innerText = `${tx.from} ➔ ${tx.to}: ${formatMoney(tx.amount)} ${tx.note ? '('+tx.note+')' : ''}`;
                feed.appendChild(item);
            });

            // If Pay Player modal is open, dynamically refresh recipient dropdown
            if (!document.getElementById('modal-tx').classList.contains('hidden') && currentModalMode === 'PAY_PLAYER') {
                refreshRecipientDropdown();
            }
        }

        // PROPERTY MANAGEMENT MODAL
        function openPropertyModal(editIdx = -1) {
            document.getElementById('modal-property-editor').classList.remove('hidden');
            document.getElementById('prop-edit-index').value = editIdx;
            
            const lblPrice = document.getElementById('lbl-buy-price');
            const priceInput = document.getElementById('prop-price-input');
            const btnSave = document.getElementById('btn-save-prop');

            if (editIdx >= 0) {
                document.getElementById('prop-modal-title').innerText = '✏️ Editar Aluguel da Posse';
                lblPrice.classList.add('hidden');
                priceInput.classList.add('hidden');
                btnSave.innerText = 'Salvar Alterações';

                const p = (state.players[state.playerId].properties || [])[editIdx];
                if (p) {
                    document.getElementById('prop-name-input').value = p.name;
                    document.getElementById('prop-rent-input').value = p.rent;
                }
            } else {
                document.getElementById('prop-modal-title').innerText = '🏠 Comprar Nova Posse ao Banco';
                lblPrice.classList.remove('hidden');
                priceInput.classList.remove('hidden');
                btnSave.innerText = 'Confirmar Compra ao Banco 🏦';

                document.getElementById('prop-name-input').value = '';
                document.getElementById('prop-price-input').value = '';
                document.getElementById('prop-rent-input').value = '';
            }
        }

        function closePropertyModal() {
            document.getElementById('modal-property-editor').classList.add('hidden');
        }

        function saveProperty() {
            const name = document.getElementById('prop-name-input').value.trim();
            const price = parseInt(document.getElementById('prop-price-input').value);
            const rent = parseInt(document.getElementById('prop-rent-input').value);
            const editIdx = parseInt(document.getElementById('prop-edit-index').value);
            const myData = state.players[state.playerId];

            if (editIdx < 0) {
                // New Purchase Validation
                if (!name || isNaN(price) || price <= 0 || isNaN(rent) || rent <= 0) {
                    return alert('Por favor informe o Nome, o Preço de Compra e o Valor do Aluguel!');
                }
                if (myData.balance < price) {
                    return alert('Saldo insuficiente para comprar esta posse!');
                }

                // Deduct Purchase Price to the Bank (🏦 Banco)
                myData.balance -= price;
                
                if (!myData.properties) myData.properties = [];
                myData.properties.push({ name, price, rent });

                const tx = {
                    fromId: state.playerId,
                    toId: 'BANK',
                    from: state.playerName,
                    to: '🏦 Banco',
                    amount: price,
                    note: 'Compra de Imóvel: ' + name
                };
                state.transactions.push(tx);

                playSound();
                if (state.isBanker) broadcastState();
                else sendToHost({ type: 'TRANSFER', tx: tx });
            } else {
                // Edit Existing Property
                if (!name || isNaN(rent) || rent <= 0) {
                    return alert('Por favor informe o Nome e o Valor do Aluguel!');
                }
                myData.properties[editIdx].name = name;
                myData.properties[editIdx].rent = rent;

                if (state.isBanker) broadcastState();
                else sendToHost({ type: 'UPDATE_PROPERTIES', playerId: state.playerId, properties: myData.properties });
            }

            closePropertyModal();
            updateUI();
        }

        function editProperty(idx) {
            openPropertyModal(idx);
        }

        function deleteProperty(idx) {
            if (confirm('Deseja excluir esta posse?')) {
                state.players[state.playerId].properties.splice(idx, 1);
                updateUI();
                if (state.isBanker) broadcastState();
                else sendToHost({ type: 'UPDATE_PROPERTIES', playerId: state.playerId, properties: state.players[state.playerId].properties });
            }
        }

        function passGO() {
            if (!state.players[state.playerId]) return;
            state.players[state.playerId].balance += 2000;
            const tx = {
                from: '🏦 Banco',
                to: state.playerName,
                amount: 2000,
                note: 'Passou no Ponto de Partida'
            };
            state.transactions.push(tx);
            playSound();
            updateUI();
            if (state.isBanker) broadcastState();
            else sendToHost({ type: 'TRANSFER', tx: tx });
        }

        let currentModalMode = '';
        function openModal(mode) {
            currentModalMode = mode;
            document.getElementById('modal-tx').classList.remove('hidden');
            
            const selectRec = document.getElementById('modal-recipient');
            const selectProp = document.getElementById('modal-property');
            const lblRec = document.getElementById('lbl-recipient');
            const lblProp = document.getElementById('lbl-property');
            
            document.getElementById('modal-amount').value = '';
            document.getElementById('modal-note').value = '';
            
            if (mode === 'PAY_PLAYER') {
                document.getElementById('modal-title').innerText = '💸 Pagar a um Jogador';
                lblRec.classList.remove('hidden');
                selectRec.classList.remove('hidden');
                refreshRecipientDropdown();
            } else if (mode === 'PAY_BANK') {
                document.getElementById('modal-title').innerText = '🏦 Pagar ao Banco';
                lblRec.classList.add('hidden');
                selectRec.classList.add('hidden');
                lblProp.classList.add('hidden');
                selectProp.classList.add('hidden');
            } else if (mode === 'RECEIVE_BANK') {
                document.getElementById('modal-title').innerText = '💰 Receber do Banco';
                lblRec.classList.add('hidden');
                selectRec.classList.add('hidden');
                lblProp.classList.add('hidden');
                selectProp.classList.add('hidden');
            }
        }

        function refreshRecipientDropdown() {
            const selectRec = document.getElementById('modal-recipient');
            const selectedVal = selectRec.value;
            selectRec.innerHTML = '';
            
            // Filter ALL connected players except oneself
            const allPlayers = Object.keys(state.players).filter(id => id !== state.playerId);
            
            allPlayers.forEach(pId => {
                const opt = document.createElement('option');
                opt.value = pId;
                opt.innerText = state.players[pId].name;
                selectRec.appendChild(opt);
            });

            if (allPlayers.length === 0) {
                selectRec.innerHTML = '<option value="">(Nenhum outro jogador na mesa ainda)</option>';
            } else if (selectedVal && allPlayers.includes(selectedVal)) {
                selectRec.value = selectedVal;
            }

            onRecipientChanged();
        }

        function onRecipientChanged() {
            const selectRec = document.getElementById('modal-recipient');
            const targetId = selectRec.value;
            const selectProp = document.getElementById('modal-property');
            const lblProp = document.getElementById('lbl-property');
            
            selectProp.innerHTML = '';

            if (targetId && state.players[targetId]) {
                const targetProps = state.players[targetId].properties || [];
                lblProp.classList.remove('hidden');
                selectProp.classList.remove('hidden');

                const optDefault = document.createElement('option');
                optDefault.value = '';
                optDefault.innerText = '-- Digitação Manual / Sem Posse --';
                selectProp.appendChild(optDefault);

                targetProps.forEach((p, idx) => {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.innerText = `🏠 ${p.name} - Aluguel: ${formatMoney(p.rent)}`;
                    selectProp.appendChild(opt);
                });
            } else {
                lblProp.classList.add('hidden');
                selectProp.classList.add('hidden');
            }
        }

        function onPropertySelected() {
            const selectRec = document.getElementById('modal-recipient');
            const selectProp = document.getElementById('modal-property');
            const targetId = selectRec.value;
            const propIdx = selectProp.value;

            if (targetId && state.players[targetId] && propIdx !== '') {
                const p = state.players[targetId].properties[propIdx];
                if (p) {
                    document.getElementById('modal-amount').value = p.rent;
                    document.getElementById('modal-note').value = 'Aluguel: ' + p.name;
                }
            }
        }

        function addAmount(val) {
            const input = document.getElementById('modal-amount');
            input.value = (parseInt(input.value) || 0) + val;
        }

        function closeModal() {
            document.getElementById('modal-tx').classList.add('hidden');
        }

        function confirmTransfer() {
            const amount = parseInt(document.getElementById('modal-amount').value);
            const note = document.getElementById('modal-note').value.trim();
            if (!amount || amount <= 0) return alert('Informe um valor válido!');

            const myData = state.players[state.playerId];
            if (!myData) return;

            if (currentModalMode === 'PAY_PLAYER') {
                const select = document.getElementById('modal-recipient');
                const targetId = select.value;
                if (!targetId || !state.players[targetId]) return alert('Selecione um jogador válido na mesa!');
                if (myData.balance < amount) return alert('Saldo insuficiente!');

                myData.balance -= amount;
                state.players[targetId].balance += amount;

                const tx = {
                    fromId: state.playerId,
                    toId: targetId,
                    from: state.playerName,
                    to: state.players[targetId].name,
                    amount: amount,
                    note: note
                };

                state.transactions.push(tx);
                if (state.isBanker) broadcastState();
                else sendToHost({ type: 'TRANSFER', tx: tx });
            } else if (currentModalMode === 'PAY_BANK') {
                if (myData.balance < amount) return alert('Saldo insuficiente!');
                myData.balance -= amount;
                const tx = {
                    fromId: state.playerId,
                    toId: 'BANK',
                    from: state.playerName,
                    to: '🏦 Banco',
                    amount: amount,
                    note: note || 'Pagamento ao Banco'
                };
                state.transactions.push(tx);
                if (state.isBanker) broadcastState();
                else sendToHost({ type: 'TRANSFER', tx: tx });
            } else if (currentModalMode === 'RECEIVE_BANK') {
                myData.balance += amount;
                const tx = {
                    fromId: 'BANK',
                    toId: state.playerId,
                    from: '🏦 Banco',
                    to: state.playerName,
                    amount: amount,
                    note: note || 'Recebido do Banco'
                };
                state.transactions.push(tx);
                if (state.isBanker) broadcastState();
                else sendToHost({ type: 'TRANSFER', tx: tx });
            }

            playSound();
            closeModal();
            updateUI();
        }

        function leaveRoom() {
            if (confirm('Deseja sair da mesa atual?')) {
                clearSession();
                location.reload();
            }
        }

        function endGame() {
            if (confirm('Tem certeza que deseja FINALIZAR A PARTIDA para todos?')) {
                clearSession();
                if (state.isBanker) {
                    broadcastState();
                }
                location.reload();
            }
        }
    </script>
</body>
</html>
